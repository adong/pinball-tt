<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c4dff">
<title>TT Pinball · Teddy &amp; Tommy</title>
<!-- The game's icon: the same emoji as its card on the dashboard, on a coloured tile. It's the browser tab's icon (the SVG, then
     a PNG drawn below) and the iPad home screen's (apple-touch-icon). The device's own emoji font draws it: no image files. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20x='2'%20y='2'%20width='60'%20height='60'%20rx='14'%20fill='%237c4dff'%20stroke='%2314121f'%20stroke-width='4'/%3E%3Ctext%20x='32'%20y='44'%20font-size='36'%20text-anchor='middle'%3E%F0%9F%8C%80%3C/text%3E%3C/svg%3E">
<script>
  (function (emoji, tile) {
    function draw(size, framed) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const g = c.getContext('2d');
      if (!g) return '';
      const u = size / 64;
      g.fillStyle = tile;
      if (framed) { // the tab: a rounded tile with the dashboard's dark outline
        g.beginPath();
        if (g.roundRect) g.roundRect(2 * u, 2 * u, 60 * u, 60 * u, 14 * u); else g.rect(2 * u, 2 * u, 60 * u, 60 * u);
        g.fill();
        g.lineWidth = 4 * u;
        g.strokeStyle = '#14121f';
        g.stroke();
      } else g.fillRect(0, 0, size, size); // the home screen: iOS rounds the corners itself
      g.font = `${Math.round(size * (framed ? 0.56 : 0.62))}px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif`;
      g.textAlign = 'center';
      const m = g.measureText(emoji);
      const up = m.actualBoundingBoxAscent || size * 0.4, down = m.actualBoundingBoxDescent || 0;
      g.fillText(emoji, size / 2, size / 2 + (up - down) / 2);
      try { return c.toDataURL('image/png'); } catch (e) { return ''; }
    }
    const tab = draw(64, true), home = draw(180, false);
    if (tab) document.querySelector('link[rel="icon"]').href = tab;
    if (home) {
      const l = document.createElement('link');
      l.rel = 'apple-touch-icon';
      l.href = home;
      document.head.appendChild(l);
    }
  })('🌀', '#7c4dff');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --teddy: #3d9bff;
    --teddy-l: #9fd0ff;
    --tommy: #2fd6a2;
    --tommy-l: #9ff2d6;
    --yellow: #ffd23f;
    --pink: #ff6fb5;
    --violet: #7c4dff;
    --ink: #14121f;
    --display: 'Bungee', 'Arial Black', Impact, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #1a1446; color: #fff;
    font-family: 'Rubik', system-ui, -apple-system, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  img { -webkit-user-drag: none; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .top { position: absolute; left: 0; right: 0; top: 0; padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left));
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; }
  .cards { grid-column: 1; grid-row: 1; justify-self: start; display: flex; flex-direction: column; gap: 6px; }
  .pcard { display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border-radius: 999px;
    background: rgba(20,18,40,0.62); border: 3px solid var(--teddy-l); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); transition: transform 0.2s, opacity 0.2s; }
  .pcard.m { border-color: var(--tommy-l); }
  .two .pcard { opacity: 0.6; transform: scale(0.92); transform-origin: left center; }
  .two .pcard.on { opacity: 1; transform: none; box-shadow: 0 0 16px rgba(255,255,255,0.45); }
  .pcard .face { width: 44px; height: 44px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #e8f4ff, var(--teddy)); object-fit: cover; }
  .pcard.m .face { background: radial-gradient(circle at 50% 35%, #e9fff6, var(--tommy)); }
  .pcard .score { display: block; font-family: var(--display); font-size: 20px; line-height: 1.05; text-shadow: 0 2px 0 rgba(0,0,0,0.45); }
  .pcard .balls { font-size: 13px; letter-spacing: 2px; color: var(--yellow); }
  .mid { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .mid .row { display: flex; gap: 8px; align-items: center; pointer-events: auto; }
  .pill { font-family: var(--display); font-size: 15px; padding: 7px 14px; border-radius: 999px; background: rgba(20,18,40,0.6); border: 3px solid rgba(255,255,255,0.85);
    text-shadow: 0 2px 0 rgba(0,0,0,0.4); white-space: nowrap; }
  .ibtn { width: 44px; height: 44px; border-radius: 14px; font-size: 18px; background: rgba(20,18,40,0.55); border: 2px solid rgba(255,255,255,0.8); display: grid; place-items: center; }
  .ibtn:active { transform: scale(0.94); }
  #tiltTag { font-family: var(--display); font-size: 14px; padding: 4px 12px; border-radius: 999px; background: #ff4b4b; border: 2px solid #fff; }

  /* the companion button: top right */
  #callBtn { grid-column: 3; grid-row: 1; justify-self: end; pointer-events: auto; position: relative; display: flex; align-items: center; gap: 8px; padding: 4px 16px 4px 4px;
    border-radius: 999px; background: rgba(20,18,40,0.6); border: 3px solid var(--tommy-l); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #callBtn.t { border-color: var(--teddy-l); }
  #callBtn .face { position: relative; width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 35%, #e9fff6, var(--tommy)); flex: none; }
  #callBtn.t .face { background: radial-gradient(circle at 50% 35%, #e8f4ff, var(--teddy)); }
  #callBtn .face img { width: 100%; height: 100%; object-fit: cover; }
  #callBtn .face .five { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; }
  #callBtn .cool { position: absolute; inset: 0; border-radius: 50%; }
  #callBtn em { font-style: normal; font-family: var(--display); font-size: 14px; line-height: 1.1; text-align: left; text-shadow: 0 2px 0 rgba(0,0,0,0.5); }
  #callBtn em small { display: block; font-family: 'Rubik', sans-serif; font-weight: 700; font-size: 11px; opacity: 0.85; }
  #callBtn:active { transform: scale(0.95); }
  #callBtn.here { box-shadow: 0 0 18px var(--tommy); }
  #callBtn.t.here { box-shadow: 0 0 18px var(--teddy); }
  #saverBar { position: absolute; right: max(12px, env(safe-area-inset-right)); top: 76px; display: flex; align-items: center; gap: 6px; font-size: 18px; }
  #saverBar i { width: 110px; height: 12px; border-radius: 7px; border: 2px solid #fff; background: rgba(20,18,40,0.6); overflow: hidden; }
  #saverBar b { display: block; height: 100%; background: linear-gradient(90deg, #7ef6ff, #ffd23f); transform-origin: left; }

  /* the launch hint, and the touch pads */
  #hint { position: fixed; left: 50%; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 4px); transform: translateX(-50%); pointer-events: none; text-align: center;
    font-family: var(--display); font-size: clamp(13px, 2.2vw, 19px); padding: 6px 16px 8px; border-radius: 14px; background: rgba(20,18,40,0.7); border: 3px solid #fff; white-space: nowrap; }
  body.touch #hint { bottom: 86px; }
  #hint i { display: block; height: 8px; margin-top: 5px; border-radius: 5px; background: rgba(255,255,255,0.25); overflow: hidden; }
  #hint i b { display: block; height: 100%; background: linear-gradient(90deg, #7dff8a, #ffd23f, #ff4b4b); transform-origin: left; transform: scaleX(0); }
  #pads { position: fixed; left: 0; right: 0; bottom: 0; height: 70px; pointer-events: none; }
  .pad { position: absolute; bottom: max(8px, env(safe-area-inset-bottom)); width: 34vw; max-width: 260px; height: 58px; border-radius: 18px; pointer-events: auto;
    background: rgba(255,255,255,0.16); border: 3px solid rgba(255,255,255,0.7); font-family: var(--display); font-size: 22px; display: grid; place-items: center; }
  .pad:active { background: rgba(255,255,255,0.4); }
  #padL { left: max(60px, env(safe-area-inset-left)); }
  #padR { right: max(10px, env(safe-area-inset-right)); }
  #btnNudge { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); pointer-events: auto; font-family: var(--display); font-size: 13px;
    padding: 10px 12px; border-radius: 16px; background: rgba(20,18,40,0.6); border: 2px solid rgba(255,255,255,0.8); }

  /* ---------- toasts and the turn banner ---------- */
  #toasts { position: fixed; left: 0; right: 0; top: max(24vh, 130px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
  .toast { font-family: var(--display); font-size: clamp(14px, 2.3vw, 22px); text-align: center; padding: 5px 16px; border-radius: 16px;
    background: rgba(20,18,40,0.7); border: 3px solid #fff; text-shadow: 0 3px 0 rgba(0,0,0,0.45); max-width: 92vw; }
  .toast.huge { font-size: clamp(18px, 3.4vw, 34px); color: var(--yellow); }
  .toast.t { border-color: var(--teddy-l); }
  .toast.m { border-color: var(--tommy-l); }
  #banner { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; padding: 14px 30px 16px;
    border-radius: 26px; background: rgba(20,18,40,0.72); border: 4px solid var(--teddy-l); }
  #banner.m { border-color: var(--tommy-l); }
  #banner h2 { font-family: var(--display); font-size: clamp(24px, 5vw, 44px); font-weight: 400; line-height: 1.1; }
  #banner p { font-family: var(--display); font-size: clamp(14px, 2.2vw, 20px); color: var(--yellow); margin-top: 4px; }

  /* ---------- screens ---------- */
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 18px;
    background: radial-gradient(ellipse at center, rgba(20,18,40,0.3), rgba(20,18,40,0.75)); overflow-y: auto; }
  .screen > * { flex-shrink: 0; }
  .screen > :first-child { margin-top: auto; }
  .screen > :last-child { margin-bottom: auto; }
  .screen.high { background: linear-gradient(180deg, rgba(20,18,40,0.6), rgba(20,18,40,0) 70%); justify-content: flex-start; }
  .screen.high > :first-child { margin-top: max(5vh, 30px); }
  .logo { font-family: var(--display); font-weight: 400; font-size: clamp(50px, 11vw, 112px); line-height: 0.95; letter-spacing: 1px; text-align: center;
    color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink), 0 0 30px rgba(160,110,255,0.9); }
  .logo .a { color: var(--yellow); }
  .logo .b { color: #ff8fd6; }
  .sub { font-weight: 800; font-size: clamp(16px, 2.6vw, 22px); text-shadow: 0 2px 0 rgba(0,0,0,0.5); margin-top: -6px; text-align: center; }
  .picks { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .kid { width: 170px; padding: 10px 10px 12px; border-radius: 24px; background: rgba(20,18,40,0.6); border: 4px solid var(--teddy-l); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .kid.m { border-color: var(--tommy-l); }
  .kid.sel { transform: scale(1.05); box-shadow: 0 0 22px rgba(255,255,255,0.35); }
  .kid img { width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #e8f4ff, var(--teddy)); }
  .kid.m img { background: radial-gradient(circle at 50% 35%, #e9fff6, var(--tommy)); }
  .kid b { font-family: var(--display); font-weight: 400; font-size: 26px; margin-top: 4px; }
  .kid small { font-weight: 800; font-size: 13px; opacity: 0.85; }
  .kid:hover, .kid:focus-visible, .big:hover, .big:focus-visible { box-shadow: 0 0 22px rgba(255,255,255,0.4); outline: none; }
  .kid:active, .big:active { transform: scale(0.97); }
  .big { font-family: var(--display); font-size: 24px; padding: 12px 28px; border-radius: 22px; background: linear-gradient(180deg, #ffe066, #ffb52e); color: var(--ink);
    border: 4px solid var(--ink); box-shadow: 0 5px 0 var(--ink); display: inline-flex; align-items: center; gap: 10px; }
  .big.two { background: linear-gradient(90deg, var(--teddy-l), var(--tommy-l)); }
  .big.two img { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.6); }
  .big small { display: block; font-family: 'Rubik', sans-serif; font-weight: 800; font-size: 12px; }
  .big.ghost { background: rgba(255,255,255,0.85); }
  .opts { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .seg { display: flex; border-radius: 999px; overflow: hidden; border: 3px solid #fff; background: rgba(20,18,40,0.6); }
  .seg button { font-family: var(--display); font-size: 15px; padding: 9px 16px; opacity: 0.6; min-height: 44px; }
  .seg button.on { background: #fff; color: var(--ink); opacity: 1; }
  .chip { font-family: var(--display); font-size: 15px; padding: 9px 16px; border-radius: 999px; border: 3px solid #fff; background: rgba(20,18,40,0.6); min-height: 44px; }
  .keys { font-weight: 700; font-size: 13px; opacity: 0.9; text-align: center; max-width: 780px; line-height: 1.55; text-shadow: 0 2px 0 rgba(0,0,0,0.5); }
  .keys kbd { font-family: inherit; background: rgba(255,255,255,0.18); border-radius: 6px; padding: 1px 6px; }
  .best { font-family: var(--display); font-size: 14px; opacity: 0.9; min-height: 1em; }
  .card { background: rgba(20,18,40,0.86); border: 4px solid #fff; border-radius: 28px; padding: 18px 26px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; max-width: 92vw; }
  .card h2 { font-family: var(--display); font-weight: 400; font-size: clamp(28px, 6vw, 50px); line-height: 1; }
  .card .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .scores { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; font-family: var(--display); font-size: 20px; }
  .scores span { padding: 4px 14px; border-radius: 999px; border: 3px solid var(--teddy-l); }
  .scores span.m { border-color: var(--tommy-l); }
  .scores b { color: var(--yellow); font-weight: 400; }

  /* small phones */
  @media (max-width: 640px) {
    .pcard .face { width: 34px; height: 34px; }
    .pcard .score { font-size: 15px; }
    .pcard { padding-right: 10px; }
    .pill { font-size: 12px; padding: 5px 10px; }
    .ibtn { width: 40px; height: 40px; font-size: 15px; }
    #callBtn em { display: none; }
    #callBtn { padding: 3px; }
    #callBtn .face { width: 46px; height: 46px; }
    #saverBar { top: 64px; }
    #saverBar i { width: 70px; }
    .kid { width: 136px; }
    .kid img { width: 86px; height: 86px; }
    .big { font-size: 20px; padding: 10px 20px; }
    #tableName { display: none; }
  }
  /* short screens (a phone on its side): the HUD goes down the sides, beside the table */
  @media (max-height: 520px) {
    .screen { gap: 6px; padding: 8px; }
    .logo { font-size: clamp(34px, 11vh, 60px); }
    .sub { font-size: 14px; }
    .kid { width: 130px; padding: 5px 8px 7px; border-radius: 18px; }
    .kid img { width: 50px; height: 50px; }
    .kid b { font-size: 18px; }
    .big { font-size: 17px; padding: 7px 16px; }
    .big.two img { width: 30px; height: 30px; }
    .keys { display: none; }
    .card { padding: 10px 16px; gap: 6px; }
    .card h2 { font-size: clamp(22px, 9vh, 36px); }
    .seg button, .chip { font-size: 13px; padding: 6px 12px; min-height: 40px; }
    .top { grid-template-columns: auto 1fr auto; }
    .mid { grid-column: 1; grid-row: 2; align-items: flex-start; }
    #tableName { display: none; }
    #toasts { top: 26vh; }
    #banner { padding: 8px 20px 10px; }
    .pad { height: 54px; width: 130px; }
    #padL { left: max(60px, env(safe-area-inset-left)); bottom: 8px; }
    body.touch #hint { bottom: 70px; }
  }
  body.calm * { transition: none !important; animation: none !important; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud" class="hidden">
  <div class="top">
    <div class="cards" id="cards">
      <div class="pcard" id="cardA"><img class="face" id="faceA" alt=""><div><b class="score" id="scoreA">0</b><span class="balls" id="ballsA"></span></div></div>
      <div class="pcard m hidden" id="cardB"><img class="face" id="faceB" alt=""><div><b class="score" id="scoreB">0</b><span class="balls" id="ballsB"></span></div></div>
    </div>
    <div class="mid">
      <div class="row">
        <button class="ibtn" id="btnPause" title="Pause (P)">❚❚</button>
        <div class="pill" id="tableName"></div>
        <button class="ibtn" id="btnMute" title="Sound">🔊</button>
      </div>
      <div id="tiltTag" class="hidden">TILT!</div>
    </div>
    <button id="callBtn"><span class="face"><img alt=""><span class="five hidden">✋</span><span class="cool"></span></span><em></em></button>
  </div>
  <div id="saverBar" class="hidden"><span>🛟</span><i><b></b></i></div>
</div>

<div id="pads" class="hidden">
  <button class="pad" id="padL">◀</button>
  <button id="btnNudge">NUDGE</button>
  <button class="pad" id="padR">▶</button>
</div>
<div id="hint" class="hidden"><span id="hintText"></span><i><b id="power"></b></i></div>
<div id="toasts"></div>
<div id="banner" class="hidden"><h2 id="bnWho"></h2><p id="bnBall"></p></div>

<div id="title" class="screen">
  <h1 class="logo" id="logo" data-no-lang></h1>
  <p class="sub" id="subtitle"></p>
  <div class="picks">
    <button class="kid t" data-hero="teddy"><img alt=""><b>TEDDY</b><small>1 PLAYER</small></button>
    <button class="kid m" data-hero="tommy"><img alt=""><b>TOMMY</b><small>1 PLAYER</small></button>
  </div>
  <button class="big two" id="btn2p"><img alt="" id="img2pT"><span>2 PLAYERS<small>Teddy and Tommy take turns</small></span><img alt="" id="img2pM"></button>
  <div class="opts">
    <div class="seg" id="tables"><button data-table="space">🚀 SPACE</button><button data-table="jungle">🐒 JUNGLE</button><button data-table="candy">🍭 CANDY</button></div>
  </div>
  <div class="opts">
    <div class="seg" id="segEasy"><button data-easy="1">🐣 EASY</button><button data-easy="0">🔥 NORMAL</button></div>
    <button class="chip" id="btnMute2">🔊</button>
  </div>
  <p class="best" id="bestLine"></p>
  <p class="keys" data-zh="<kbd>Z</kbd> 左挡板 · <kbd>M</kbd> 右挡板（也可以用 <kbd>←</kbd> <kbd>→</kbd>）· 按住 <kbd>空格</kbd> 拉弹簧，松开发射 · <kbd>N</kbd> 或 <kbd>↑</kbd> 摇一摇<br>手指：左半边屏幕是左挡板，右半边是右挡板 · <kbd>T</kbd> 叫兄弟来帮忙 · <kbd>P</kbd> 暂停 · 在菜单里按 <kbd>M</kbd> 开关声音">
    <kbd>Z</kbd> left flipper · <kbd>M</kbd> right flipper (or <kbd>←</kbd> <kbd>→</kbd>) · hold <kbd>Space</kbd> to pull the plunger, let go to launch · <kbd>N</kbd> or <kbd>↑</kbd> nudges<br>
    Fingers: the left half of the screen is the left flipper, the right half the right one · <kbd>T</kbd> calls your brother · <kbd>P</kbd> pause · <kbd>M</kbd> on the menus switches the sound
  </p>
</div>

<div id="pause" class="screen hidden">
  <div class="card">
    <h2>PAUSED</h2>
    <div class="row"><button class="big" id="btnResume">▶ PLAY</button></div>
    <div class="row"><button class="big ghost" id="btnRestart">↻ START AGAIN</button><button class="big ghost" id="btnMenu">🏠 MENU</button></div>
  </div>
</div>

<div id="over" class="screen high hidden">
  <div class="card">
    <h2 id="overTitle">GREAT GAME!</h2>
    <div class="scores" id="overText"></div>
    <p class="best" id="overBest"></p>
    <div class="row"><button class="big" id="btnAgain">PLAY AGAIN</button><button class="big ghost" id="btnOverMenu">🏠 MENU</button></div>
  </div>
</div>

<script src="kit/three.min.js"></script>
<script src="kit/gfx.js"></script>
<script src="kit/people.js"></script>
<script src="kit/roster.js"></script>
<script src="kit/portraits.js"></script>
<script src="kit/sound.js"></script>
<script src="kit/lang.js"></script>
<script src="kit/help.js"></script>
